name: Comparative economics and full article evidence
on:
  pull_request:
    paths: ['research/shared/**', 'research/issuers/**', 'scripts/audit_delivery_matrix.py', 'public/**', 'research/rebuild-v10/**', '.github/workflows/verify-comparative-economics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-economics-and-native-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Exact financial guards survive normal and optimized Python
        run: |
          python -m unittest discover -s research/shared -p 'test_*.py' -v
          python -O -m unittest discover -s research/shared -p 'test_*economics*.py' -v
          python -O -m unittest discover -s research/shared -p 'test_income_generalization.py' -v
      - name: Verify and rebuild four original source PDF publications
        env:
          FINANCIALS_SOURCE_ROOT: ${{ github.workspace }}/work
        run: |
          python research/rebuild-v10/download_originals.py
          python research/rebuild-v10/publisher.py
          for code in 600036 688111 600519 000333; do cmp public/research/2026-h1-v10/$code.html research/rebuild-v10/site/$code.html; done
          python -m unittest discover -s research/rebuild-v10 -p 'test_signed_label_geometry.py' -v
      - name: Prove generated articles reproduce checked-in bytes
        run: |
          mkdir -p /tmp/rebuilt
          python research/shared/build_two_sector.py --code 600900 --out /tmp/rebuilt/600900.html
          python research/shared/build_two_sector.py --code 600276 --out /tmp/rebuilt/600276.html
          python research/issuers/688220/publish.py --out /tmp/rebuilt/688220.html --qa /tmp/rebuilt/688220-qa.json
          python research/issuers/601628/publish.py --out /tmp/rebuilt/601628.html
          for code in 600900 600276 688220 601628; do cmp public/$code.html /tmp/rebuilt/$code.html; done
      - name: Source, publication and handoff contracts
        run: |
          python scripts/check_handoff.py
          python scripts/check_release_contract.py
          python scripts/check_pr35_quality_handoff.py
          python scripts/check_visual_editorial_policy.py
          python scripts/audit_aei_editorial_delivery.py --fail-known
          python scripts/audit_v10_flow_contract.py --strict
      - name: Observe every catalog article and every exhibit at three real viewports
        run: python scripts/audit_delivery_matrix.py --out delivery-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-article-current-sha-evidence
          path: delivery-evidence
