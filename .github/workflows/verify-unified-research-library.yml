name: Verify unified issuer research library (live)
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/300394.html'
      - 'public/300308.html'
      - 'public/300502.html'
      - 'public/*.html'
      - 'public/research/**'
      - 'public/research/2026-h1-v10/**'
      - 'site/**'
      - '.github/workflows/verify-unified-research-library.yml'
      - 'scripts/check_release_contract.py'
      - 'skills/ashare-financial-storytelling/quality-regressions.json'
      - 'research/issuers/**/release-gates.json'
      - 'research/issuers/**/source-ledger.json'
      - 'research/issuers/**/figure-briefs.json'
  pull_request:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/300394.html'
      - 'public/300308.html'
      - 'public/300502.html'
      - 'public/*.html'
      - 'public/research/**'
      - 'public/research/2026-h1-v10/**'
      - 'site/**'
      - '.github/workflows/verify-unified-research-library.yml'
      - 'scripts/check_release_contract.py'
      - 'scripts/test_check_release_contract.py'
      - 'skills/ashare-financial-storytelling/quality-regressions.json'
      - 'research/issuers/**/release-gates.json'
      - 'research/issuers/**/source-ledger.json'
      - 'research/issuers/**/figure-briefs.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-route-and-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clean generator and catalog regression
        run: |
          python -m unittest discover -s site -p 'test_portal.py' -v
          python site/portal_builder.py --out /tmp/financials-rebuilt-portal
          cmp public/index.html /tmp/financials-rebuilt-portal/index.html
          python scripts/check_handoff.py
          python scripts/check_release_contract.py
          python -m unittest discover -s scripts -p test_check_release_contract.py -v
          python research/shared/test_conserved_flow.py
      - name: Install Chromium, Playwright and Chinese fonts
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -qi 'Noto'
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install chromium
      - name: Real Cloudflare unified issuer-library acceptance
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json,pathlib
          from playwright.sync_api import sync_playwright
          home='https://financials-in-visuals.pages.dev'
          old={'300394':'/300394.html','300308':'/300308.html','300502':'/300502.html'}
          initial_new={x:f'/research/2026-h1-v10/{x}.html' for x in ['600036','688111','600519','000333']}
          catalog=json.loads(pathlib.Path('site/research_catalog.json').read_text())['issuers']
          allroutes={x['code']:x['href'] for x in catalog}
          assert len(allroutes)==len(catalog)>=7
          assert all(allroutes.get(code)==path for code,path in {**old,**initial_new}.items())
          count=len(catalog)
          optical_count=sum(x['industry']=='光通信' for x in catalog)
          out=pathlib.Path('unified-site-evidence');out.mkdir(exist_ok=True)
          errors=[];records=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width,height in [(1440,900),(768,1024),(390,844)]:
              page=browser.new_page(viewport={'width':width,'height':height})
              page.on('pageerror',lambda e:errors.append(str(e)))
              res=page.goto(home,wait_until='networkidle',timeout=45000)
              assert res and res.status==200,'Site root failed'
              assert page.locator('a.company').count()==count,('unified company count',width)
              assert page.locator('a.company:visible').count()==count
              assert page.locator('a.feature[href="/optical-2026h1.html"]').count()==1
              assert page.evaluate('document.documentElement.scrollWidth')<=width+1
              page.screenshot(path=str(out/f'home_{width}.png'),full_page=True)
              page.locator('button[data-filter="光通信"]').click()
              assert page.locator('a.company:visible').count()==optical_count
              page.locator('button[data-filter="all"]').click()
              page.locator('input[type="search"]').fill('600036')
              assert page.locator('a.company:visible').count()==1
              page.locator('input[type="search"]').fill('')
              assert page.locator('a.company:visible').count()==count
              for ticker,path in allroutes.items():
                page.goto(home+path,wait_until='networkidle',timeout=45000)
                assert page.locator('figure').count()>=(6 if ticker in old or ticker in initial_new else 1),(ticker,'report figures; finance/editorial gate is independent')
                if ticker in old:
                  assert page.locator('.money-ribbon').count()>=2,(ticker,'old optical money flows lost')
                  assert page.locator('a.site-library-link[href="/#companies"]').count()==1,(ticker,'old back-to-library')
                elif ticker in initial_new:
                  assert page.locator('.sankey-svg svg').count()>=1,(ticker,'existing v10 sankey missing')
                  assert page.locator('a.brand[href="/#companies"]').count()==1,(ticker,'v10 back-to-library')
                else:
                  assert page.locator('a[href="/#companies"]').count()>=1,(ticker,'new issuer lacks library return')
                  if ticker in ('600900','600276'):
                    issuer_data=json.loads(pathlib.Path('research/issuers',ticker,'source-ledger.json').read_text())
                    n_sources=len(issuer_data['segments'])
                    assert page.locator('figure.figure').count()==8,(ticker,'new sector preview lost any sourced figure')
                    assert page.locator('table').count()==8,(ticker,'new sector preview source tables missing')
                    assert page.locator('#chart-flow rect.money-source').count()==n_sources,(ticker,'weighted exclusive source rectangles absent in real live HTML')
                    assert page.locator('#chart-flow rect.money-sink').count()==2,(ticker,'weighted gross profit and cost sinks absent in live HTML')
                    assert page.locator('#chart-flow path.money-ribbon').count()==2*n_sources,(ticker,'source-specific cost and GP ribbons missing')
                    assert issuer_data['source']['original_bytes_sha256'] in page.content(),(ticker,'real PDF identity not printed in live article')
                    assert page.locator('#chart-cfo > svg').count()==1,(ticker,'complete signed indirect CFO exhibit missing')
                    assert page.locator('#chart-pnl > svg').count()==1,(ticker,'signed consolidated P&L bridge missing')
                    assert page.locator('#chart-balance > svg').count()==1,(ticker,'two-date stock composition missing')
                    assert page.locator('[data-export]').count()==8,(ticker,'eight independently usable SVG exports missing')
                    # v8.7.1: each issuer retains the original 8 desktop full
                    # financial vectors AND renders 8 source-ledger-driven,
                    # genuinely upright native phone SVGs; never count both
                    # as one chart or call a small horizontal window PASS.
                    assert page.locator('.plot > svg').count()==8,(ticker,'eight actual desktop original SVGs lost')
                    assert page.locator('.native-mobile-finance svg').count()==8,(ticker,'eight original 390px finance figures lost')
                    if width==390:
                      assert page.locator('.native-mobile-finance:visible').count()==8,(ticker,'390 native originals are not actually visible')
                      assert page.locator('.plot > svg:visible').count()==0,(ticker,'old clipped 760px original desktop graph still shown in phone')
                      figures=page.evaluate("""() => [...document.querySelectorAll('.plot')].map(x=>({
                        inner:x.scrollWidth,visible:x.clientWidth,
                        financeSvg:x.querySelector('.native-mobile-finance svg')?.getBoundingClientRect().width||0
                      }))""")
                      assert all(z['inner']<=z['visible']+2 and 250<=z['financeSvg']<=z['visible']+1 for z in figures),(ticker,'original phone finance chart still internally clipped',figures)
                    if width==1440:
                      vis=page.evaluate("""() => ['flow','pnl','cfo','cash','balance'].map(id=>{
                         const node=document.querySelector('#chart-'+id);
                         return {id,inner:node.scrollWidth,visible:node.clientWidth};
                      })""")
                      assert all(z['inner']<=z['visible']+2 for z in vis),(ticker,'new public desktop chart cropped',vis)
                  if ticker=='688220':
                    assert page.locator('#chart-flow svg').count()==1,'ASR original-source money-flow Sankey missing'
                    expected_figures=len(json.loads(pathlib.Path('research/issuers/688220/figure-briefs.json').read_text())['figure_briefs'])
                    assert page.locator('table.evidence-table').count()==expected_figures,'ASR source-linked figure tables missing'
                    assert '9d276876a4341bc3c8d2735be43c7f70cb5dc0f4e7c669b16e96a11a814d1bdc' in page.content(),'ASR PDF source fingerprint missing'
                    assert page.locator('[data-export]').count()==expected_figures,'ASR authored figure SVG export controls missing'
                    assert page.locator('#chart-pnl svg').count()==1,'ASR full signed GAAP P&L missing'
                    assert page.locator('#chart-balance svg').count()==1,'ASR equal-total BS funding composition missing'
                    assert page.locator('#chart-flow path.money-ribbon').count()==7,'ASR source-to-cost+GP seven actually positive weighted edges missing'
                    # Live release identity: test the real rendered proportional
                    # source geometry, not a stale page with the same 9 SVG counts.
                    assert page.locator('#chart-flow rect.money-source').count()==4,'ASR source amounts not represented as geometric nodes'
                    assert page.locator('#chart-flow rect.money-sink').count()==2,'ASR cost/GP sink geometry absent'
                    tiny=page.locator('#chart-flow rect.money-source[data-source-key="other_service_rev"]')
                    assert tiny.count()==1,'new original-source geometry release missing on production'
                    tiny_height=float(tiny.get_attribute('height'))
                    assert 0<tiny_height<0.02,(ticker,width,'source tiny real amount was visually inflated',tiny_height)
                    assert page.locator('#chart-flow path.money-ribbon[data-source-key="other_service_rev"][data-target-key="cogs"]').count()==1
                    assert page.locator('#chart-flow path.money-ribbon[data-source-key="other_service_rev"][data-target-key="gross_profit"]').count()==0,'real zero GP must not become fake green ribbon'
                    if width==1440:
                      v=page.evaluate("""() => ['flow','pnl','balance','cash'].map(id=>{
                        let c=document.querySelector('#chart-'+id);
                        return {id,inner:c.scrollWidth,visible:c.clientWidth};
                      })""")
                      assert all(x['inner']<=x['visible']+2 for x in v),(ticker,width,'desktop clip in published finance chart',v)
                assert page.evaluate('document.documentElement.scrollWidth')<=width+1,(ticker,width,'body overflow')
                page.screenshot(path=str(out/f'{ticker}_{width}.png'),full_page=True)
                records.append({'ticker':ticker,'width':width,'figures':page.locator('figure').count(),'status':'PASS'})
              page.close()
            page=browser.new_page(viewport={'width':1440,'height':900})
            page.goto(home,wait_until='networkidle')
            page.locator('a.company[href="/300394.html"]').click()
            assert page.url.endswith('/300394') or page.url.endswith('/300394.html')
            page.locator('a.site-library-link[href="/#companies"]').click()
            assert page.url.startswith(home+'/') and page.url.endswith('#companies'),page.url
            page.locator('a.company[href="/research/2026-h1-v10/688111.html"]').click()
            assert '/research/2026-h1-v10/688111' in page.url
            page.locator('a.brand[href="/#companies"]').click()
            assert page.url.startswith(home+'/') and page.url.endswith('#companies'),page.url
            page.goto(home,wait_until='networkidle')
            page.locator('a.company[href="/688220.html"]').click()
            assert '/688220' in page.url and page.locator('#chart-flow svg').count()==1,'ASR eighth issuer live route failed'
            page.locator('a[href="#cash"]').first.click()
            assert page.url.endswith('#cash'),'ASR real cash-section anchor failed'
            page.locator('a.brand[href="/#companies"]').click()
            assert page.url.endswith('#companies'),'ASR back to unified company library failed'
            for code in ['600900','600276']:
              page.goto(home,wait_until='networkidle')
              page.locator(f'a.company[href="/{code}.html"]').click()
              assert f'/{code}' in page.url,(code,'new independent company route is not navigable')
              # A desktop original amount-weighted SVG and a separately authored
              # mobile finance SVG coexist in the DOM. Count each genuine
              # presentation independently; the old broad selector falsely
              # rejected valid, source-conserved mobile-native releases.
              assert page.locator('#chart-flow > svg').count()==1,(code,'desktop original money-flow SVG absent or duplicated')
              assert page.locator('#chart-flow .native-mobile-finance svg').count()==1,(code,'native mobile original-money SVG absent or duplicated')
              assert page.locator('#chart-flow svg').count()==2,(code,'unexpected duplicated or missing authored finance graphics')
              page.locator('a[href="/#companies"]').first.click()
              assert page.url.endswith('#companies'),(code,'new report fails to return to single catalog')
            page.locator('a.feature[href="/optical-2026h1.html"]').click()
            assert 'optical-2026h1' in page.url
            browser.close()
          assert len(records)==3*count,len(records)
          assert not errors,errors
          (out/'result.json').write_text(json.dumps({'root':'PASS','company_count':count,'issuer_viewport_checks':len(records),'filter_search':'PASS','prior_money_flow':'PASS','live_navigation_existing_issuers':'PASS','new_issuer_financial_editorial':'NOT_CHECKED','script_errors':errors},ensure_ascii=False,indent=2))
          print('UNIFIED_COMPANY_ROUTE_LIVE_PASS',len(records),'viewport route checks for',count,'issuers; existing seven chart regressions; finance/editorial separately gated')
          PY
      - name: Archive real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-issuer-library-live-evidence
          path: unified-site-evidence/
          retention-days: 30
          if-no-files-found: warn