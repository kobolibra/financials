name: Candidate 688220 source-native mobile nine-figure editorial test
on:
  push:
    branches: ['work/688220-native-mobile-visual-editorial-20261104', 'quality/aei-sankey-source-contract-v1']
    paths:
      - 'research/issuers/688220/**'
      - 'public/688220.html'
      - 'research/shared/source_income_adapter.py'
      - 'research/shared/unified_income_sankey.py'
      - '.github/workflows/candidate-688220-native-money-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  semiconductor-source-native-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Actual original 224 PDF and hostile money visual source auditing
        run: |
          python -m pip install -q pymupdf
          python research/issuers/688220/verify_pages.py
          python research/issuers/688220/test_accounting.py
          python -m unittest research/issuers/688220/test_native_mobile.py -v
          python -m unittest discover -s research/shared -p test_source_income_adapter.py -v
          python research/issuers/688220/publish.py --out public/688220.html --qa research/issuers/688220/qa.json
      - name: Real Noto Chinese typography and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh family | grep -qi Noto
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Actual source geometric original 9 mobile financial charts, signed PnL/CFO and CJK 1440 768 390
        run: |
          python research/issuers/688220/qa_browser.py --html public/688220.html --out research/issuers/688220/visual-qa-native
      - name: Exact reproducible standalone HTML source and original desktop SVG
        run: |
          python research/issuers/688220/publish.py --out /tmp/asr-688220-again.html --qa /tmp/asr-688220-again-qa.json
          cmp public/688220.html /tmp/asr-688220-again.html
          grep -q 'FINANCIALS_UNIFIED_STORY_V1' public/688220.html
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,hashlib
          previous=subprocess.check_output(['git','show','HEAD:public/688220.html']).decode()
          new=Path('public/688220.html').read_text()
          for key in ("pnl","balance","cfo"):
              old=re.search(r'<div class="vizscroll" id="chart-'+key+r'"[^>]*></div>',previous)
              modern=re.search(r'<div class="vizscroll" id="chart-'+key+r'"[^>]*></div>',new)
              assert old and modern and old.group(0)==modern.group(0),key
          # Desktop SVG is JSON-escaped inside an offline JS string while
          # native mobile SVG is literal HTML. A raw quote count sees only
          # the phone; test BOTH encodings and browser DOM separately.
          def both(token):
              return new.count(token) + new.count(token.replace('"', r'\\"'))
          assert both('data-design-system="FINANCIALS_UNIFIED_STORY_V1"')==2
          assert both('data-node-id="revenue-total"')==2
          assert both('data-stage="source-to-revenue"')==8
          assert both('data-stage="revenue-to-outcome"')==14
          assert 'MIRROR_COMPLETE_PDF_SHA_PASS__OFFICIAL_EQUIVALENCE_NOT_CHECKED' in new
          assert new.count('class="native-asr"')==9
          print('NINE_REAL_SEMICONDUCTOR_NATIVE_MOBILE_AND_ORIGINAL_DESKTOP_TEMPLATE_PASS',hashlib.sha256(new.encode()).hexdigest())
          PY
      - name: Commit candidate-only HTML and source-bound real CJK screenshot proof
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config user.name "financials-research-bot"
          git config user.email "financials-research-bot@users.noreply.github.com"
          git add public/688220.html research/issuers/688220/qa.json
          git add research/issuers/688220/visual-qa-native/result.json
          git add research/issuers/688220/visual-qa-native/flow_1440.png research/issuers/688220/visual-qa-native/flow_390.png
          git add research/issuers/688220/visual-qa-native/pnl_390.png research/issuers/688220/visual-qa-native/cfo_390.png
          if ! git diff --cached --quiet; then
            git commit -m "Source rebuild true native semiconductor mobile money article and real screenshots"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive genuine Chromium screenshots and exact standalone source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-semiconductor-688220-native-mobile-source-visual
          path: |
            public/688220.html
            research/issuers/688220/qa.json
            research/issuers/688220/visual-qa-native/
          retention-days: 30
