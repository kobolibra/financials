name: V10 original-source native finance rebuild and browser QA
on:
  push:
    branches: [quality/aei-sankey-source-contract-v1]
    paths:
      - '.github/workflows/verify-v10-native-rebuild.yml'
      - 'research/rebuild-v10/native_mobile.py'
      - 'research/rebuild-v10/test_editorial_chart_quality.py'
      - 'research/rebuild-v10/publisher.py'
      - 'research/rebuild-v10/qa_native_browser.py'
      - 'research/rebuild-v10/download_originals.py'
      - 'research/shared/editorial_financial_flow.py'
      - 'scripts/audit_v10_flow_contract.py'
      - 'scripts/test_audit_v10_flow_contract.py'
  workflow_dispatch:
concurrency:
  group: v10-source-bound-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  original-yuan-source-browser-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF and real CJK Chromium browser
        run: |
          python -m pip install --disable-pip-version-check pymupdf playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Download and SHA validate all four real original issuer PDF disclosures
        run: python research/rebuild-v10/download_originals.py
      - name: Source-typed full original PDF verification and 4 new HTML rebuild
        env:
          FINANCIALS_SOURCE_ROOT: ${{ github.workspace }}/work
        run: |
          python research/rebuild-v10/verify.py
          python research/rebuild-v10/publisher.py
      - name: Test all financial diagrams in real 1440/768/390 CJK Chromium
        run: python research/rebuild-v10/qa_native_browser.py
      - name: Verify exact same generated HTML is the proposed independent publication
        run: |
          cp research/rebuild-v10/site/{600036,688111,600519,000333}.html public/research/2026-h1-v10/
          python scripts/audit_v10_flow_contract.py --strict --out research/rebuild-v10/strict-semantic-audit.json
          python scripts/audit_aei_editorial_delivery.py --fail-known --out research/rebuild-v10/structural-visual-audit.json
          python -m unittest discover -s scripts -p 'test_audit_v10_flow_contract.py' -v
          python -m unittest discover -s research/rebuild-v10 -p 'test_editorial_chart_quality.py' -v
          python -m unittest discover -s research/shared -p 'test_editorial_financial_flow.py' -v
          python scripts/check_visual_editorial_policy.py
          python scripts/test_visual_editorial_policy.py
      - name: Commit actual rebuilt four source-audited company HTML pages and Chromium receipts to branch
        run: |
          git config user.name "financials-qa-bot"
          git config user.email "financials-qa-bot@users.noreply.github.com"
          git add public/research/2026-h1-v10/600036.html public/research/2026-h1-v10/688111.html public/research/2026-h1-v10/600519.html public/research/2026-h1-v10/000333.html
          git add research/rebuild-v10/build-manifest.json research/rebuild-v10/strict-semantic-audit.json research/rebuild-v10/structural-visual-audit.json research/rebuild-v10/real-browser-qa/result.json
          git diff --cached --quiet || git commit -m "Rebuild four V10 reports with source-typed original finance and 3-viewport native QA receipts"
          # PR source-gate QA can advance the branch while original PDFs are
          # being downloaded. Rebase on the exact current remote rather than
          # force-pushing over changes, and fail closed on a real conflict.
          git fetch origin quality/aei-sankey-source-contract-v1
          git rebase FETCH_HEAD
          git push origin HEAD:quality/aei-sankey-source-contract-v1
      - name: Save independent per-figure Chinese Chromium screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-real-CJK-1440-768-390-source-bound-financial-figures
          path: |
            research/rebuild-v10/real-browser-qa/
            research/rebuild-v10/strict-semantic-audit.json
            research/rebuild-v10/structural-visual-audit.json
          retention-days: 30
          if-no-files-found: warn
