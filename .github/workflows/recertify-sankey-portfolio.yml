name: Re-certify current financial Sankey reader art against real source ledgers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-full-article-browser-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install full Chinese browser and finance source inspection prerequisites
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.2 pymupdf==1.26.6
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Fail immediately if any release candidate contract is malformed
        run: |
          for code in 600206 600690 300548 300570 688220; do
            python -m json.tool "research/issuers/$code/release-gates.json" >/dev/null
          done
      - name: Restore frozen original v10 source PDFs by exact SHA
        run: python research/rebuild-v10/download_originals.py
      - name: Verify deterministic report builds
        run: |
          export FINANCIALS_SOURCE_ROOT="$PWD/work"
          python research/rebuild-v10/publisher.py
          for code in 688111 000333 600036 600519; do
            cmp "research/rebuild-v10/site/$code.html" "public/research/2026-h1-v10/$code.html"
          done
          for code in 600900 600276; do
            python research/shared/build_two_sector.py --code "$code" --out "/tmp/$code.html"
            cmp "/tmp/$code.html" "public/$code.html"
          done
          for code in 600690 300548 300570; do
            python research/shared/source_publication.py "research/issuers/$code" "/tmp/$code.html"
            cmp "/tmp/$code.html" "public/$code.html"
          done
          python research/shared/source_publication.py research/issuers/600206 /tmp/600206.html --catalog-report
          cmp /tmp/600206.html public/600206.html
          python research/issuers/688220/publish.py --out /tmp/688220.html --qa /tmp/688220-qa.json
          cmp /tmp/688220.html public/688220.html
      - name: Recheck ALL source-ledger facts and current HTML figure exports with real Chromium
        run: |
          python scripts/qa_editorial_migration.py --codes 300394 300308 300502 688111 000333 688220 600690 300548 300570 --out work/current-sankey-portfolio
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("work/current-sankey-portfolio/result.json").read_text())
          assert result["status"]=="PASS_LOCAL",result.get("status")
          assert len(result["issuers"])==9 and len(result["cases"])==27
          assert all(i["complete_figure_migration"]=="PASS_LOCAL" for i in result["issuers"].values())
          assert result["independent_human_art_review"]=="NOT_CHECKED"
          print("ACTUAL_NINE_ISSUER_SOURCE_FINANCIAL_AND_BROWSER_PROOF_PASS",result["svg_exports"])
          PY
      - name: Capture current 600206 source-original figures in Chromium and WebKit
        run: |
          python scripts/qa_offline_candidate.py public/600206.html --engine chromium --out work/600206-visual-current/chromium
          python scripts/qa_offline_candidate.py public/600206.html --engine webkit --out work/600206-visual-current/webkit
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=hashlib.sha256(Path('public/600206.html').read_bytes()).hexdigest()
          for engine,expected in [('chromium',{1440,768,390}),('webkit',{375})]:
              p=Path('work/600206-visual-current')/engine/'browser.json'
              d=json.loads(p.read_text())
              assert d['sha256']==sha
              assert {v['width'] for v in d['viewports']}==expected
              expected_ids=[f['id'] for f in json.loads(Path('research/issuers/600206/publication.json').read_text())['figures']]
              assert all([f['id'] for f in v['figures']]==expected_ids for v in d['viewports'])
              assert all(not f['issues'] and not f['overlap'] for v in d['viewports'] for f in v['figures'])
              print('CURRENT_600206_FULL_NATIVE_PDF_SOURCE_AND_BROWSER_RECEIPT_PASS',engine,sha)
          PY
      - name: Archive actual screenshots and original-finance source SVG downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-current-sankey-native-current-html-full-portfolio
          path: |
            work/current-sankey-portfolio/
            work/600206-visual-current/
          retention-days: 30
          if-no-files-found: warn
