name: Verify original 2026 H1 financial report PDFs

on:
  push:
    branches:
      - pdf-source-validation-2026h1
    paths:
      - .github/workflows/verify-2026h1-pdfs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF verifier
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Download exact issuer filings and verify
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, json, hashlib, time, datetime, urllib.request, urllib.error
          from pypdf import PdfReader
          root = pathlib.Path("pdf-source-artifacts")
          root.mkdir(exist_ok=True)
          sources = [
            ("688111", "Kingsoft Office", 199, "https://static.cninfo.com.cn/finalpage/2026-08-20/1225482678.PDF"),
            ("600519", "Kweichow Moutai", 110, "https://static.cninfo.com.cn/finalpage/2026-08-15/1225475868.PDF"),
            ("000333", "Midea Group", 205, "https://disc.static.szse.cn/disc/disk03/finalpage/2026-08-29/df25443f-d67a-4cc5-8bd6-6c3e681a9575.PDF"),
          ]
          results=[]
          for ticker,ename,expected_pages,url in sources:
              status={"ticker":ticker,"company":ename,"source_url":url,"expected_pages":expected_pages}
              path=root/f"{ticker}_2026H1_original.pdf"
              try:
                  raw=None
                  for attempt in range(1,5):
                      try:
                          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; FinancialResearchSourceAudit/1.0)","Accept":"application/pdf,*/*","Referer":"https://www.cninfo.com.cn/"})
                          with urllib.request.urlopen(req,timeout=45) as resp:
                              raw=resp.read()
                          break
                      except Exception as e:
                          print(f"{ticker} attempt {attempt}: {e}",flush=True)
                          if attempt==4: raise
                          time.sleep(attempt*3)
                  assert raw and raw[:5]==b"%PDF-", "File not PDF"
                  assert len(raw)>250_000, "PDF smaller than expected"
                  path.write_bytes(raw)
                  reader=PdfReader(str(path))
                  pages=len(reader.pages)
                  assert pages==expected_pages, f"Wrong page count {pages}; expected {expected_pages}"
                  first=" ".join((p.extract_text() or "") for p in reader.pages[:2])
                  assert "2026" in first and (ticker in first or (ticker=="000333" and "美的集团股份有限公司" in first)), "Issuer identity/year missing in extracted front matter"
                  status.update(status="PASS",file=path.name,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),pages=pages,first_page_text=first[:400])
                  print(f"PASS {ticker} pages={pages} bytes={len(raw)} sha256={status['sha256']}",flush=True)
              except Exception as e:
                  status.update(status="FAIL",error=str(e))
                  path.unlink(missing_ok=True)
                  print(f"FAIL {ticker}: {e}",flush=True)
              results.append(status)
          manifest={"created_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"reports":results,"all_pass":all(x["status"]=="PASS" for x in results)}
          (root/"source-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          if not manifest["all_pass"]: raise SystemExit("One or more source PDFs failed validation")
          PY
      - name: Upload original source PDFs and SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-2026h1-pdfs
          path: pdf-source-artifacts/
          if-no-files-found: error
          retention-days: 7
