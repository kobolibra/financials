name: PR35 Cloudflare exact bytes and real mobile touch preview gate
on:
  push:
    branches: [quality/aei-sankey-source-contract-v1]
    paths:
      - '.github/workflows/verify-v10-cloudflare-preview.yml'
      - 'research/rebuild-v10/qa_cloudflare_preview.py'
      - 'research/rebuild-v10/qa_cloudflare_interactions.py'
      - 'public/research/2026-h1-v10/**'
      - 'research/rebuild-v10/qa_native_browser.py'
  workflow_dispatch:
concurrency:
  group: v10-cloudflare-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview-full-byte-and-touch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch actual current main, not historical reference used by previous checks
        run: |
          git fetch origin main:refs/remotes/origin/main
          git rev-parse refs/remotes/origin/main
      - name: Install actual real Chromium and WebKit touchscreen browser engines and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Confirm this exact PR version is internally consistent before testing remote published HTML
        run: |
          python scripts/check_pr35_quality_handoff.py
          python -m unittest discover -s scripts -p test_check_pr35_quality_handoff.py -v
      - name: Read actual current PR branch deployment and production bytes, then inspect all finance SVG in touch browsers
        env:
          FINANCIALS_PR_PREVIEW: https://quality-aei-sankey-source-co.financials-in-visuals.pages.dev
          FINANCIALS_PRODUCTION: https://financials-in-visuals.pages.dev
        run: |
          python research/rebuild-v10/qa_cloudflare_preview.py
      - name: Verify 11 exact online company routes and all 108 visible-original SVG exports with source keyboard disclosures
        env:
          FINANCIALS_PR_PREVIEW: https://quality-aei-sankey-source-co.financials-in-visuals.pages.dev
        run: |
          python research/rebuild-v10/qa_cloudflare_interactions.py
      - name: Archive online screenshots and exact live byte receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-cloudflare-exact-byte-touchscreen-live-preview-release-gate
          path: |
            research/rebuild-v10/cloudflare-release-qa/
            research/rebuild-v10/cloudflare-interaction-qa/
          retention-days: 30
          if-no-files-found: warn
