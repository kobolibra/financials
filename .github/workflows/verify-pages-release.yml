name: Verify public beta release and live Pages routes
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pages-release.yml"
      - "public/**"
      - "skills/ashare-financial-storytelling/SKILL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-and-deployment-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check local served HTTP routes and source markers
        shell: bash
        run: |
          python - <<'PY'
          import os,threading,http.server,socketserver,urllib.request,pathlib
          from html.parser import HTMLParser
          root=pathlib.Path("public").resolve()
          expected=["600036","601318","000002","000333","600519","600276","600900"]
          index=(root/"index.html").read_text()
          labindex=(root/"research-lab/2026-h1/index.html").read_text()
          assert 'research-lab/2026-h1/index.html' in index, "homepage missing lab"
          for ticker in expected:
              assert f"./{ticker}.html" in labindex, f"Lab directory missing {ticker}"
              page=(root/"research-lab/2026-h1"/f"{ticker}.html").read_text()
              assert ticker in page and "PDF SHA256" in page and "原始完整 PDF" in page
              assert "BETA" in page and "<svg" in page and "物理页" in page
              assert "<iframe" not in page.lower() and "<script src=" not in page.lower()
              assert "返回" in page and 'href="./index.html"' in page
          class Server(http.server.SimpleHTTPRequestHandler):
              def __init__(self,*a,**k): super().__init__(*a,directory=str(root),**k)
              def log_message(self,*args): pass
          httpd=http.server.ThreadingHTTPServer(("127.0.0.1",0),Server)
          threading.Thread(target=httpd.serve_forever,daemon=True).start()
          base=f"http://127.0.0.1:{httpd.server_address[1]}"
          for path,needle in [("/", "research-lab/2026-h1/index.html"),("/research-lab/2026-h1/","同一套研究证据")]+[(f"/research-lab/2026-h1/{t}.html",t) for t in expected]:
              with urllib.request.urlopen(base+path,timeout=8) as res:
                  body=res.read().decode()
                  assert res.status==200 and needle in body, f"Bad served HTML {path}"
                  assert res.headers.get("Content-Type","").startswith("text/html"), f"Bad MIME {path}"
                  print("LOCAL_HTTP_PASS",path,res.status,len(body),flush=True)
          httpd.shutdown()
          PY
      - name: Check live Cloudflare Pages publishing identity
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, socket, time
          host="https://financials-in-visuals.pages.dev"
          urls=[
            ("/","research-lab/2026-h1/index.html"),
            ("/research-lab/2026-h1/index.html","同一套研究证据"),
            ("/research-lab/2026-h1/600036.html","银行的收入"),
            ("/research-lab/2026-h1/601318.html","保险集团的营运利润"),
          ]
          for attempt in range(1,5):
              try:
                  for path,marker in urls:
                      req=urllib.request.Request(host+path,headers={"User-Agent":"FinancialsInVisualsReleaseQA/1.0"})
                      with urllib.request.urlopen(req,timeout=20) as res:
                          data=res.read().decode("utf-8","replace")
                          if res.status!=200 or marker not in data:
                              raise RuntimeError(f"Unexpected public content: {path} status {res.status}, marker {marker} absent, bytes={len(data)}")
                          print("LIVE_PAGES_PASS",path,res.status,len(data),flush=True)
                  print("PUBLISHED_AND_VERIFIED",flush=True)
                  break
              except Exception as e:
                  print(f"LIVE_PAGES_NOT_VERIFIED attempt={attempt}: {type(e).__name__}: {e}",flush=True)
                  if attempt==4: raise
                  time.sleep(12)
          PY
