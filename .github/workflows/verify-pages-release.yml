name: Verify public beta release and live Pages routes
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pages-release.yml"
      - "public/**"
      - "skills/ashare-financial-storytelling/SKILL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-and-deployment-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check local served HTTP routes and source markers
        shell: bash
        run: |
          python - <<'PY'
          import os,threading,http.server,socketserver,urllib.request,pathlib
          from html.parser import HTMLParser
          root=pathlib.Path("public").resolve()
          expected=["600036","601318","000002","000333","600519","600276","600900"]
          index=(root/"index.html").read_text()
          labindex=(root/"research-lab/2026-h1/index.html").read_text()
          assert 'research-lab/2026-h1/index.html' in index, "homepage missing lab"
          for ticker in expected:
              assert f"./{ticker}.html" in labindex, f"Lab directory missing {ticker}"
              page=(root/"research-lab/2026-h1"/f"{ticker}.html").read_text()
              assert ticker in page and "PDF SHA256" in page and "原始完整 PDF" in page
              assert "BETA" in page and "<svg" in page and "物理页" in page
              assert "<iframe" not in page.lower() and "<script src=" not in page.lower()
              assert 'href="./index.html"' in page and "研究实验室目录" in page, f"Back-link missing {ticker}"
          class Server(http.server.SimpleHTTPRequestHandler):
              def __init__(self,*a,**k): super().__init__(*a,directory=str(root),**k)
              def log_message(self,*args): pass
          httpd=http.server.ThreadingHTTPServer(("127.0.0.1",0),Server)
          threading.Thread(target=httpd.serve_forever,daemon=True).start()
          base=f"http://127.0.0.1:{httpd.server_address[1]}"
          for path,needle in [("/", "research-lab/2026-h1/index.html"),("/research-lab/2026-h1/","同一套研究证据")]+[(f"/research-lab/2026-h1/{t}.html",t) for t in expected]:
              with urllib.request.urlopen(base+path,timeout=8) as res:
                  body=res.read().decode()
                  assert res.status==200 and needle in body, f"Bad served HTML {path}"
                  assert res.headers.get("Content-Type","").startswith("text/html"), f"Bad MIME {path}"
                  print("LOCAL_HTTP_PASS",path,res.status,len(body),flush=True)
          httpd.shutdown()
          PY
      - name: Check live Cloudflare Pages publishing identity
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, socket, time
          host="https://financials-in-visuals.pages.dev"
          urls=[
            ("/","research-lab/2026-h1/index.html"),
            ("/research-lab/2026-h1/index.html","同一套研究证据"),
            ("/research-lab/2026-h1/600036.html","银行的收入"),
            ("/research-lab/2026-h1/601318.html","保险集团的营运利润"),
            ("/research-lab/2026-h1/000002.html","流动性风险"),
            ("/research-lab/2026-h1/000333.html","制造企业的合并收入"),
            ("/research-lab/2026-h1/600519.html","消费龙头的总收入"),
            ("/research-lab/2026-h1/600276.html","创新药增长"),
            ("/research-lab/2026-h1/600900.html","电力收入增长"),
          ]
          for attempt in range(1,5):
              try:
                  for path,marker in urls:
                      req=urllib.request.Request(host+path,headers={"User-Agent":"FinancialsInVisualsReleaseQA/1.0"})
                      with urllib.request.urlopen(req,timeout=20) as res:
                          data=res.read().decode("utf-8","replace")
                          if res.status!=200 or marker not in data:
                              raise RuntimeError(f"Unexpected public content: {path} status {res.status}, marker {marker} absent, bytes={len(data)}")
                          print("LIVE_PAGES_PASS",path,res.status,len(data),flush=True)
                  print("PUBLISHED_AND_VERIFIED",flush=True)
                  break
              except Exception as e:
                  print(f"LIVE_PAGES_NOT_VERIFIED attempt={attempt}: {type(e).__name__}: {e}",flush=True)
                  if attempt==4: raise
                  time.sleep(12)
          PY
      - name: Install Chinese font family for faithful visual screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'
      - name: Install browser QA dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser acceptance on actual Cloudflare live pages
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,pathlib
          base='https://financials-in-visuals.pages.dev'
          ids=['600036','601318','000002','000333','600519','600276','600900']
          errors=[]
          out=pathlib.Path('browser-qa-screenshots');out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height in [(1440,900),(768,1000),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                  page.on('pageerror',lambda error: errors.append(str(error)))
                  for id in ids:
                      u=f'{base}/research-lab/2026-h1/{id}.html'
                      resp=page.goto(u,wait_until='networkidle',timeout=30000)
                      assert resp and resp.status==200,(u,resp.status if resp else None)
                      assert page.locator('svg').count()>=1,(id,'no graph')
                      check=page.evaluate("({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,body:document.body.scrollWidth})")
                      assert check['sw']<=width+1,(id,width,check)
                      assert page.locator('a[href="./index.html"]').count()>=1,(id,'missing back link')
                      page.screenshot(path=str(out/f'{id}_{width}.png'),full_page=True)
                      print('LIVE_BROWSER_PASS',id,width,'body_width',check['sw'],flush=True)
                  page.close()
              page=browser.new_page(viewport={'width':1440,'height':900})
              resp=page.goto(base,wait_until='domcontentloaded')
              assert resp.status==200
              page.locator('a[href="./research-lab/2026-h1/index.html"]').first.click()
              assert '/research-lab/2026-h1/' in page.url, page.url
              page.locator('a[href="./600036.html"]').first.click()
              assert page.url.endswith('/600036.html') or page.url.endswith('/600036'),page.url
              page.locator('a[href="./index.html"]').first.click()
              assert page.url.endswith('/index.html'),page.url
              print('LIVE_NAVIGATION_CLICK_PASS homepage-to-lab-to-company-to-lab',flush=True)
              browser.close()
          assert not errors,f'Browser JS errors: {errors}'
          (out/'summary.json').write_text(json.dumps({'viewports':[1440,768,390],'issuers':ids,'passed':21,'js_errors':errors,'real_navigation':'PASS','site':base},indent=2))
          PY
      - name: Validate published multi-figure research articles on the real website
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,pathlib
          out=pathlib.Path('browser-qa-screenshots');out.mkdir(exist_ok=True)
          host='https://financials-in-visuals.pages.dev'
          articles={'688111':7,'600519':6,'000333':7}
          failures=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height in [(1440,900),(768,1024),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                  page.on('pageerror',lambda error:failures.append(str(error)))
                  for ticker,required in articles.items():
                      url=f'{host}/research/2026-h1/{ticker}.html'
                      response=page.goto(url,wait_until='networkidle',timeout=45000)
                      assert response and response.status==200,(ticker,'HTTP',response.status if response else None)
                      n=page.locator('figure').count()
                      assert n>=required,(ticker,'figures',n)
                      assert page.locator('svg').count()>=required,(ticker,'svg',page.locator('svg').count())
                      assert page.locator('table').count()>=required,(ticker,'data tables',page.locator('table').count())
                      assert page.locator('a[href*=".PDF#page="]').count()>=2,(ticker,'PDF links absent')
                      assert page.locator('a[href="#cash"]').count()>=1,(ticker,'analyst cash chapter missing')
                      measure=page.evaluate("({scrollWidth:document.documentElement.scrollWidth,client:document.documentElement.clientWidth})")
                      assert measure['scrollWidth']<=width+1,(ticker,width,measure)
                      page.screenshot(path=str(out/f'research_{ticker}_{width}.png'),full_page=True)
                      print('RESEARCH_LIVE_BROWSER_PASS',ticker,'width',width,'figures',n,'scroll',measure['scrollWidth'],flush=True)
                  page.close()
              page=browser.new_page(viewport={'width':1440,'height':900})
              response=page.goto(host,wait_until='networkidle')
              assert response and response.status==200
              page.locator('a[href="./research/2026-h1/index.html"]').first.click()
              assert '/research/2026-h1/' in page.url,page.url
              page.locator('a[href="./688111.html"]').first.click()
              assert '/research/2026-h1/688111' in page.url,page.url
              page.locator('a[href="#cash"]').first.click()
              assert page.url.endswith('#cash'),page.url
              print('RESEARCH_ACTUAL_NAV_PASS home-to-index-to-report-to-cash',flush=True)
              browser.close()
          assert not failures,failures
          (out/'research-summary.json').write_text(json.dumps({'issuers':list(articles),'viewport_widths':[1440,768,390],'render_checks':9,'navigation':'PASS','js_errors':[]},indent=2))
          PY
      - name: Archive visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cloudflare-beta-browser-qa
          path: browser-qa-screenshots/
          retention-days: 30
          if-no-files-found: warn
