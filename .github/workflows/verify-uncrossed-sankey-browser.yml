name: Verify actual recut Sankey artwork in Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/*.html'
      - 'public/research/**/*.html'
      - 'research/shared/unified_income_sankey.py'
      - 'research/shared/test_income_generalization.py'
      - 'scripts/qa_current_sankey_browser.py'
      - '.github/workflows/verify-uncrossed-sankey-browser.yml'
permissions:
  contents: read
jobs:
  original-amount-source-svg-current-html-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reconfirm all actual public Sankey ports against source-verified figures
        run: python -m unittest discover -s research/shared -p test_income_generalization.py -v
      - name: Install native Chromium/WebKit and CJK fonts
        run: |
          python -m pip install pymupdf==1.26.6 playwright==1.65.2
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Audit actual published source Sankey SVG in native Chromium and WebKit
        run: |
          python scripts/qa_current_sankey_browser.py --out work/uncrossed
          python - <<'PY'
          import json,pathlib
          receipt=json.loads(pathlib.Path('work/uncrossed/receipt.json').read_text())
          routes={r['route'] for r in receipt['routes']}
          assert len(routes)==11,(len(routes),routes)
          assert all(r['status']=='SOURCE_GEOMETRY_PASS' and r['geometry_crossings']==0 for r in receipt['routes'])
          assert receipt['independent_art_and_financial_review']=='NOT_CHECKED'
          print('CURRENT_FULL_PORTFOLIO_TRUE_BROWSER_SCREENSHOTS_COLLECTED',len(receipt['routes']))
          PY
      - name: Verify the supported annual source-dossier compiler is byte-for-byte reproducible
        run: |
          python research/shared/source_publication.py research/issuers/600206 /tmp/600206.html --catalog-report
          cmp public/600206.html /tmp/600206.html
          # 600690, 300548 and 300570 are independently published legacy-V2
          # designs; their whole-article proof is the real-browser nine-issuer
          # source-geometry census, not an unsupported offline V2 compiler.
      - name: Preserve true current HTML screenshots and money evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-income-uncrossed-native-browser-evidence
          path: work/uncrossed/
          if-no-files-found: warn
          retention-days: 30
