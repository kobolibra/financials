name: Verify actual recut Sankey artwork in Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/*.html'
      - 'public/research/**/*.html'
      - 'research/shared/unified_income_sankey.py'
      - 'research/shared/test_income_generalization.py'
      - '.github/workflows/verify-uncrossed-sankey-browser.yml'
permissions:
  contents: read
jobs:
  original-amount-source-svg-current-html-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reconfirm all actual public Sankey ports against source-verified figures
        run: python -m unittest discover -s research/shared -p test_income_generalization.py -v
      - name: Install native Chromium/WebKit and CJK fonts
        run: |
          python -m pip install pymupdf==1.26.6 playwright==1.65.2
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Audit desktop and mobile financial SVGs on real CJK browsers
        run: |
          for code in 600206 600690 300548 300570; do
            python scripts/qa_offline_candidate.py "public/$code.html" --engine chromium --out "work/uncrossed/$code/chromium"
            python scripts/qa_offline_candidate.py "public/$code.html" --engine webkit --out "work/uncrossed/$code/webkit"
          done
          python - <<'PY'
          import hashlib,json,pathlib
          for code in ('600206','600690','300548','300570'):
              p=pathlib.Path('public')/(code+'.html')
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              for engine,widths in (('chromium',{1440,768,390}),('webkit',{375})):
                  doc=json.loads((pathlib.Path('work/uncrossed')/code/engine/'browser.json').read_text())
                  assert doc['sha256']==sha,(code,engine,'SHA_MISMATCH')
                  assert {v['width'] for v in doc['viewports']}==widths,(code,engine,'VIEWPORT_GAP')
                  for view in doc['viewports']:
                      assert all(not f['issues'] and not f['overlap'] for f in view['figures']),(code,engine,'SVG_VISUAL_BLOCK')
                  print('UNCROSSED_NATIVE_BROWSER_AND_SOURCE_SHA_PASS',code,engine,sha,flush=True)
          PY
      - name: Verify canonically generated source dossier pages remain reproducible
        run: |
          for code in 600206 600690 300548 300570; do
            python research/shared/source_publication.py "research/issuers/$code" "/tmp/$code.html" --catalog-report
            cmp "public/$code.html" "/tmp/$code.html"
          done
      - name: Preserve true current HTML screenshots and money evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-income-uncrossed-native-browser-evidence
          path: work/uncrossed/
          if-no-files-found: warn
          retention-days: 30
