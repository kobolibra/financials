name: Source-verify pharma and utility 2026 H1 PDFs
on:
  push:
    branches: [pdf-source-validation-2026h1]
    paths: [.github/workflows/acquire-pharma-utility-2026h1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Download, validate and record identities
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,pathlib,hashlib,json,datetime,time
          import fitz
          out=pathlib.Path('sources');out.mkdir(exist_ok=True)
          reports=[
            {'ticker':'600276','company':'江苏恒瑞医药股份有限公司','url':'https://static.cninfo.com.cn/finalpage/2026-08-20/1225483600.PDF','type':'pharma'},
            {'ticker':'600900','company':'中国长江电力股份有限公司','url':'https://static.cninfo.com.cn/finalpage/2026-08-31/1225534923.PDF','type':'utility'}
          ]
          items=[]
          for x in reports:
            status=x.copy()
            for i in range(3):
              try:
                req=urllib.request.Request(x['url'],headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
                with urllib.request.urlopen(req,timeout=75) as h: raw=h.read()
                assert raw.startswith(b'%PDF-') and len(raw)>100000,'not full PDF bytes'
                doc=fitz.open(stream=raw,filetype='pdf')
                assert len(doc)>60,'too few pages for full report'
                front=''.join(p.get_text() for p in list(doc)[:4]).replace(' ','').replace('\\n','')
                assert '2026' in front and (x['company'] in front or (x['ticker'] in front)),'issuer/year mismatch'
                filename=f"{x['ticker']}_2026H1_original.pdf"
                (out/filename).write_bytes(raw)
                status.update(status='PASS',file=filename,pages=len(doc),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),first_extract=front[:270])
                print('PASS',x['ticker'],status['pages'],status['bytes'],status['sha256'],flush=True)
                break
              except Exception as e:
                status.update(status='FAIL',error=str(e));print('FAIL',x['ticker'],i+1,str(e),flush=True);time.sleep(3)
            items.append(status)
          (out/'manifest.json').write_text(json.dumps({'time':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':items,'all_pass':all(x['status']=='PASS' for x in items)},ensure_ascii=False,indent=2))
          if not all(x['status']=='PASS' for x in items):raise SystemExit(1)
          PY
      - name: Archive source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-2026h1-pharma-utility
          path: sources/
          retention-days: 30
          if-no-files-found: error
