name: Institutional shipping 601919 original PDF signed accounting and physical cells
on:
  push:
    branches: [work/shipping-601919-2026h1-zero-context-source-stress]
    paths:
      - 'research/issuers/601919/check_accounting.py'
      - 'research/issuers/601919/test_accounting.py'
      - 'research/issuers/601919/source-ledger.json'
      - 'research/issuers/601919/verify_source.py'
      - '.github/workflows/verify-shipping-601919-source.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shipping-source-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  original-shipping-financial-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Original true PDF 178 pages and wholly yuan cash/segment/period statements
        run: |
          python -m pip install -q pymupdf
          python -m py_compile research/issuers/601919/check_accounting.py research/issuers/601919/test_accounting.py research/issuers/601919/verify_source.py
          python research/issuers/601919/check_accounting.py
          python -m unittest discover -s research/issuers/601919 -p 'test_accounting.py' -v
      - name: Original selected 42 actual PDF physical row and current/prior column x/y proof
        run: |
          if [ ! -f research/issuers/601919/source-critical-cells.json ]; then
            python research/issuers/601919/verify_source.py --capture
          fi
          python research/issuers/601919/verify_source.py
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/issuers/601919')
          a=json.loads((p/'source-critical-cells.json').read_text())
          q=json.loads((p/'source-accounting-qa.json').read_text())
          assert len(a['selected'])>=35
          assert len(q['checks'])>=35 and all(z=='PASS' for z in q['checks'].values())
          assert q['limits']['cloudflare']=='NOT_CHECKED'
          print('SHIPPING_SOURCE_ACCOUNTING_ONLY_NO_PREMATURE_HTML_AND_NO_FAKED_LIVE_PASS',len(a['selected']),len(q['checks']))
          PY
      - name: Persist source audit for next zero-memory new conversation
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config user.name "financials-research-bot"
          git config user.email "financials-research-bot@users.noreply.github.com"
          git add research/issuers/601919/source-accounting-qa.json research/issuers/601919/source-critical-cells.json
          if ! git diff --cached --quiet; then
            git commit -m "Proof: lock actual COSCO Shipping 178-page report cells and all exact accounting invariants"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive selected original source-proof without overstating research or visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosco-shipping-601919-original-source-signed-accounting-evidence
          path: |
            research/issuers/601919/source-ledger.json
            research/issuers/601919/source-accounting-qa.json
            research/issuers/601919/source-critical-cells.json
          if-no-files-found: warn
          retention-days: 30
