name: Verify v10 source-conserved Sankey research and public pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v10-sankey-research.yml'
      - 'research/rebuild-v10/**'
      - 'public/research/2026-h1-v10/**'
      - 'public/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install finance PDF / tests and browser with Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check pymupdf pytest playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -i Noto | head -5
      - name: Retrieve source-original PDF bytes with full SHA and issuer verification
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, urllib.request, hashlib, time, sys, fitz
          root=pathlib.Path('work')
          urls={
           '600036':('additional/600036_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-28/1225531453.PDF','0194f5122575ee8576dbce941fcc10fb171e0cd17c627dd63330da952c52b57c','招商银行'),
           '688111':('financials_v8_case_study/sources/688111_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-20/1225482678.PDF','ec2322dc3a4461eef43045361391c0efe5673794302e329d03c7bbb8a3ad15a4','金山办公'),
           '600519':('financials_v8_case_study/sources/600519_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-15/1225475868.PDF','0e10aa26be46b1cf3cd03f06e834c7fb98d5dd0d661b96f8fddd4af7e846a4f6','贵州茅台'),
           '000333':('financials_v8_case_study/sources/000333_2026H1_original.pdf','https://disc.static.szse.cn/disc/disk03/finalpage/2026-08-29/df25443f-d67a-4cc5-8bd6-6c3e681a9575.PDF','576dd80e353e53296a800b03e9889a9cbb2e8b91fa2ab3c1dace7c10159179b8','美的集团')
          }
          for code,(path,url,expected,company) in urls.items():
              target=root/path;target.parent.mkdir(parents=True,exist_ok=True)
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
                      with urllib.request.urlopen(req,timeout=75) as resp: data=resp.read()
                      assert data.startswith(b'%PDF-') and hashlib.sha256(data).hexdigest()==expected,(code,'source PDF corrupted')
                      pdf=fitz.open(stream=data,filetype='pdf');assert len(pdf)>90,(code,'not original full report')
                      text=''.join(p.get_text() for p in list(pdf)[:min(8,len(pdf))]).replace(' ','').replace('\n','')
                      assert '2026' in text and (company in text or code in text),(code,'issuer or period mismatch')
                      target.write_bytes(data)
                      print('ORIGINAL_PDF_PASS',code,'pages',len(pdf),'bytes',len(data),flush=True)
                      break
                  except Exception as err:
                      print('SOURCE_DOWNLOAD_RETRY',code,attempt+1,repr(err),flush=True)
                      if attempt==2:raise
                      time.sleep(5)
          for code in ('688111','600519','000333'):
              src=pathlib.Path('research/rebuild-v10/input-ledgers')/(code+'.json')
              target=root/'financials_v8_case_study/research'/(code+'_2026H1_ledger.json')
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(src.read_bytes())
          PY
      - name: Enforce exact source accounting invariants and anti-fake Sankey tests
        shell: bash
        env:
          FINANCIALS_SOURCE_ROOT: ${{ github.workspace }}/work
        run: |
          cd research/rebuild-v10
          python verify.py
          python publisher.py
          python -m pytest -q test_sankey.py
          python - <<'PY'
          import pathlib,hashlib
          local=pathlib.Path('site');published=pathlib.Path('../../public/research/2026-h1-v10')
          for name in ('600036.html','688111.html','600519.html','000333.html'):
              expected=hashlib.sha256((published/name).read_bytes()).hexdigest()
              actual=hashlib.sha256((local/name).read_bytes()).hexdigest()
              assert actual==expected,(name,'candidate issuer report HTML differs from original verified full PDF source rebuild')
              print('EXACT_SOURCE_REBUILD_PASS',name,flush=True)
          PY
      - name: Prove ALL source-typed finance figures in true 1440/768/390 Chinese Chromium
        shell: bash
        run: |
          python research/rebuild-v10/qa_native_browser.py
          python scripts/audit_v10_flow_contract.py --strict --out research/rebuild-v10/strict-semantic-audit.json
          python scripts/audit_aei_editorial_delivery.py --fail-known --out research/rebuild-v10/structural-visual-audit.json
          python scripts/check_visual_editorial_policy.py
      - name: Check actual public Pages full report SHA without claiming a premature live deployment
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,pathlib
          base='https://financials-in-visuals.pages.dev/research/2026-h1-v10/'
          root=pathlib.Path('public/research/2026-h1-v10')
          rows=[]
          for code in ('600036','688111','600519','000333'):
              expected=hashlib.sha256((root/(code+'.html')).read_bytes()).hexdigest()
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+code+'.html',
                     headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as response:
                      raw=response.read()
                  actual=hashlib.sha256(raw).hexdigest()
                  status='PASS_LIVE_EXACT_FULL_ARTICLE_SHA' if actual==expected else 'NOT_CHECKED_PENDING_OR_DIFFERENT_LIVE_DEPLOYMENT'
              except Exception as exc:
                  actual=None
                  status='NOT_CHECKED_LIVE_HTTP_UNAVAILABLE'
              rows.append({'issuer':code,'expected_main_full_html_sha256':expected,
                           'actual_live_full_html_sha256':actual,'live_status':status})
              print('CLOUDFLARE_ACTUAL_FULL_HTML_STATUS',code,status,flush=True)
          pathlib.Path('research/rebuild-v10/real-browser-qa').mkdir(exist_ok=True)
          pathlib.Path('research/rebuild-v10/real-browser-qa/live-byte-receipt.json').write_text(
              json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Archive live browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financials-v10-original-native-finance-3-view-source-audit
          path: research/rebuild-v10/real-browser-qa/
          retention-days: 30
          if-no-files-found: warn