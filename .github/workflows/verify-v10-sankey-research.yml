name: Verify v10 source-conserved Sankey research and public pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v10-sankey-research.yml'
      - 'research/rebuild-v10/**'
      - 'public/research/2026-h1-v10/**'
      - 'public/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install finance PDF / tests and browser with Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check pymupdf pytest playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -i Noto | head -5
      - name: Retrieve source-original PDF bytes with full SHA and issuer verification
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, urllib.request, hashlib, time, sys, fitz
          root=pathlib.Path('work')
          urls={
           '600036':('additional/600036_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-28/1225531453.PDF','0194f5122575ee8576dbce941fcc10fb171e0cd17c627dd63330da952c52b57c','招商银行'),
           '688111':('financials_v8_case_study/sources/688111_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-20/1225482678.PDF','ec2322dc3a4461eef43045361391c0efe5673794302e329d03c7bbb8a3ad15a4','金山办公'),
           '600519':('financials_v8_case_study/sources/600519_2026H1_original.pdf','https://static.cninfo.com.cn/finalpage/2026-08-15/1225475868.PDF','0e10aa26be46b1cf3cd03f06e834c7fb98d5dd0d661b96f8fddd4af7e846a4f6','贵州茅台'),
           '000333':('financials_v8_case_study/sources/000333_2026H1_original.pdf','https://disc.static.szse.cn/disc/disk03/finalpage/2026-08-29/df25443f-d67a-4cc5-8bd6-6c3e681a9575.PDF','576dd80e353e53296a800b03e9889a9cbb2e8b91fa2ab3c1dace7c10159179b8','美的集团')
          }
          for code,(path,url,expected,company) in urls.items():
              target=root/path;target.parent.mkdir(parents=True,exist_ok=True)
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'})
                      with urllib.request.urlopen(req,timeout=75) as resp: data=resp.read()
                      assert data.startswith(b'%PDF-') and hashlib.sha256(data).hexdigest()==expected,(code,'source PDF corrupted')
                      pdf=fitz.open(stream=data,filetype='pdf');assert len(pdf)>90,(code,'not original full report')
                      text=''.join(p.get_text() for p in list(pdf)[:min(8,len(pdf))]).replace(' ','').replace('\n','')
                      assert '2026' in text and (company in text or code in text),(code,'issuer or period mismatch')
                      target.write_bytes(data)
                      print('ORIGINAL_PDF_PASS',code,'pages',len(pdf),'bytes',len(data),flush=True)
                      break
                  except Exception as err:
                      print('SOURCE_DOWNLOAD_RETRY',code,attempt+1,repr(err),flush=True)
                      if attempt==2:raise
                      time.sleep(5)
          for code in ('688111','600519','000333'):
              src=pathlib.Path('research/rebuild-v10/input-ledgers')/(code+'.json')
              target=root/'financials_v8_case_study/research'/(code+'_2026H1_ledger.json')
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(src.read_bytes())
          PY
      - name: Enforce exact source accounting invariants and anti-fake Sankey tests
        shell: bash
        env:
          FINANCIALS_SOURCE_ROOT: ${{ github.workspace }}/work
        run: |
          cd research/rebuild-v10
          python verify.py
          python publisher.py
          python -m pytest -q test_sankey.py
          python - <<'PY'
          import pathlib,hashlib
          local=pathlib.Path('site');published=pathlib.Path('../../public/research/2026-h1-v10')
          for name in ('index.html','600036.html','688111.html','600519.html','000333.html'):
              expected=hashlib.sha256((published/name).read_bytes()).hexdigest()
              actual=hashlib.sha256((local/name).read_bytes()).hexdigest()
              assert actual==expected,(name,'published HTML differs from source rebuilt HTML')
              print('EXACT_SOURCE_REBUILD_PASS',name,flush=True)
          PY
      - name: Verify real public Cloudflare pages, Sankey geometry and browser UX
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,time
          home='https://financials-in-visuals.pages.dev'
          root='/research/2026-h1-v10/'
          expected={'600036':8,'688111':9,'600519':9,'000333':10}
          out=Path('v10-qa');out.mkdir(exist_ok=True)
          issues=[];passed=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width,height in ((1440,960),(768,1024),(390,844)):
              page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1,accept_downloads=True)
              page.on('pageerror',lambda e:issues.append(str(e)))
              for code,count in expected.items():
                url=home+root+code+'.html'
                for attempt in range(5):
                  try:
                    resp=page.goto(url,wait_until='networkidle',timeout=40000)
                    assert resp and resp.status==200
                    assert page.locator('figure.graphic').count()==count
                    assert page.locator('figure.graphic svg[aria-label*="会计守恒财务桑基图"]').count()==1
                    break
                  except Exception:
                    if attempt==4:raise
                    time.sleep(12)
                assert page.locator('table.evidence-table').count()==count
                assert page.locator('figure.graphic path[fill-opacity]').count()>=5
                info=page.evaluate('({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})')
                assert info['sw']<=width+2,(code,width,info)
                box=page.locator('figure.graphic .sankey-svg')
                assert box.count()==1
                if width==390:
                  render=box.evaluate('(el)=>({display:getComputedStyle(el).display,sw:el.scrollWidth,cw:el.clientWidth})')
                  assert render['display']!='none' and render['sw']>render['cw'],(code,render)
                figure=box.locator('svg')
                figure.screenshot(path=str(out/f'{code}_{width}_sankey.png'))
                page.screenshot(path=str(out/f'{code}_{width}_top.png'),full_page=False)
                if width==1440:
                  with page.expect_download() as item:page.locator('button.export').first.click()
                  assert item.value.suggested_filename.endswith('.svg')
                passed.append((code,width))
                print('PUBLIC_SANKEY_BROWSER_PASS',code,width,flush=True)
              page.close()
            page=browser.new_page()
            page.goto(home+root+'index.html')
            page.locator('a[href="./600036.html"]').click()
            assert '600036' in page.url
            page.locator('a[href="#cash"]').click()
            assert page.url.endswith('#cash'),page.url
            page.locator('a.brand[href="./index.html"]').click()
            assert '/2026-h1-v10/' in page.url
            browser.close()
          assert not issues,issues
          assert len(passed)==12,len(passed)
          (out/'result.json').write_text(json.dumps({'public_route':'PASS','sankey_diagrams':4,'viewports':12,'navigation':'PASS','svg_export':'PASS','js_errors':issues},indent=2))
          print('FULL_SANKY_V10_PUBLIC_QA_PASS',flush=True)
          PY
      - name: Archive live browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financials-v10-sankey-live-qa
          path: v10-qa/
          retention-days: 30
          if-no-files-found: warn