name: Build and audit two distinct 2026H1 sector research reports
on:
  push:
    branches: ['work/two-sector-600900-600276-real-2026h1', 'work/two-sector-native-mobile-aei-original-finance-20261104', 'quality/aei-sankey-source-contract-v1', 'quality/two-sector-source-typed-profit-bridge-20261108', 'quality/two-sector-source-visual-rigor-20261109', 'quality/two-sector-quantified-editorial-20261109', 'quality/mobile-source-sankey-editorial-rows-20261109', main]
    paths:
      - 'research/issuers/600900/**'
      - 'research/issuers/600276/**'
      - 'research/shared/build_two_sector.py'
      - 'research/rebuild-v10/profit_formation.py'
      - 'research/shared/source_income_adapter.py'
      - 'research/shared/unified_income_sankey.py'
      - 'research/shared/qa_two_sector_browser.py'
      - 'research/shared/mobile_finance.js'
      - 'research/shared/qa_two_sector_browser.py'
      - 'research/shared/verify_two_sector_cells.py'
      - 'research/shared/test_two_sector_accounting.py'
      - 'research/shared/test_source_income_adapter.py'
      - 'public/600900.html'
      - 'public/600276.html'
      - '.github/workflows/build-two-sectors-2026h1.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-business-models-source-to-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python, PDF original bytes, issuer source and accounting exact-yuan checks
        run: |
          python -m pip install --disable-pip-version-check -q pymupdf
          python research/shared/verify_two_sector_cells.py --code 600900
          python research/shared/verify_two_sector_cells.py --code 600276
          python -m unittest research/shared/test_two_sector_accounting.py -v
          python -m unittest research/shared/test_source_income_adapter.py -v
          python -m unittest discover -s research/rebuild-v10 -p 'test_profit_formation.py' -v
          python research/shared/build_two_sector.py --code 600900 --out public/600900.html
          python research/shared/build_two_sector.py --code 600276 --out public/600276.html
          test -s public/600900.html
          test -s public/600276.html
      - name: Install headless real Chromium and genuine CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -qi 'Noto'
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Real original 8-figure finance SVG geometry / 1440 768 390 / exports
        run: |
          python research/shared/qa_two_sector_browser.py --code 600900
          python research/shared/qa_two_sector_browser.py --code 600276
      - name: Verify independent deterministic clean rebuilt reports
        run: |
          sha256sum public/600900.html public/600276.html
          python research/shared/build_two_sector.py --code 600900 --out /tmp/600900-second.html
          python research/shared/build_two_sector.py --code 600276 --out /tmp/600276-second.html
          cmp public/600900.html /tmp/600900-second.html
          cmp public/600276.html /tmp/600276-second.html
          python - <<'PY'
          from pathlib import Path
          import json
          for code in ('600900','600276'):
              q=json.loads(Path('research/issuers',code,'qa.json').read_text())
              assert len(q['checks'])>=10 and all(v.startswith('PASS') for v in q['checks'].values())
              a=Path('research/issuers',code,'visual-qa/result.json')
              b=json.loads(a.read_text())
              assert b['source_nodes_sinks_ribbons_exact_svg_geometric_proportions']=='PASS'
              assert all(v['body_no_overflow']=='PASS' for v in b['actual_3_viewport_checks'])
              assert b['all_eight_390px_native_money_visuals_readable_and_source_reconciled']=='PASS'
              print('INDEPENDENT_CLEAN_SOURCE_REBUILD_PASS',code)
          PY
      - name: Update only PR candidate full HTML SHA after real CJK finance QA and deterministic rebuild
        if: github.ref_name != 'main'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for code in ("600900","600276"):
              gate=Path("research/issuers")/code/"release-gates.json"
              record=json.loads(gate.read_text(encoding="utf8"))
              assert record["release_class"]=="source_limited_preview"
              actual=hashlib.sha256((Path("public")/(code+".html")).read_bytes()).hexdigest()
              evidence=json.loads((Path("research/issuers")/code/"visual-qa/result.json").read_text())
              assert evidence["html_sha256"]==actual,(code,"VISUAL_RECEIPT_NOT_CURRENT_HTML")
              assert {x["width"] for x in evidence["actual_3_viewport_checks"]}=={390,768,1440}
              assert evidence["all_eight_390px_native_money_visuals_readable_and_source_reconciled"]=="PASS"
              if actual==record["published_html_sha256"]:
                  # A provenance-only PR must NEVER invent a ghost candidate
                  # when its original HTML is already verified on production.
                  assert "unmerged_candidate" not in record,(code,"GHOST_UNMERGED_CANDIDATE")
                  assert record["live_release_fingerprint"]==actual
                  assert record["gates"]["CLOUDFLARE_LIVE"]["status"]=="PASS"
                  receipt=json.loads((Path("research/issuers")/code/"live-release-receipt.json").read_text())
                  assert receipt["actual_full_content_sha256_equals_repository_main_"+code]==actual
                  assert receipt["verified_git_commit"]==record["actual_main_release_commit"]
                  print("ALREADY_LIVE_EXACT_HTML_NO_CANDIDATE",code,actual)
                  continue
              # Changed genuinely new bytes MUST be a distinct unmerged PR
              # and cannot borrow old live receipts or independent review.
              candidate=record.get("unmerged_candidate")
              assert isinstance(candidate,dict),(code,"NEW_HTML_WITHOUT_PENDING_CANDIDATE")
              assert candidate["base_deployed_html_sha256"]==record["published_html_sha256"]
              assert candidate["promotion_status"]=="UNMERGED_NOT_DEPLOYED"
              assert candidate["independent_finance_and_art_review"]=="NOT_CHECKED"
              candidate["candidate_full_html_sha256"]=actual
              candidate["current_sha_browser_proof"]="LOCAL_ONLY"
              gate.write_text(json.dumps(record,ensure_ascii=False,indent=2)+chr(10),encoding="utf8")
              print("UNMERGED_BROWSER_SOURCE_BOUND_CANDIDATE",code,actual)
          PY
          python scripts/check_release_contract.py
      - name: Verify main's tracked issuer HTML can be rebuilt identically
        if: github.ref_name == 'main'
        run: git diff --exit-code -- public/600900.html public/600276.html research/issuers/600900/qa.json research/issuers/600276/qa.json
      - name: Commit TWO independent complete issuer HTML research reports to candidate branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git config user.name "financials-research-bot"
          git config user.email "financials-research-bot@users.noreply.github.com"
          git add public/600900.html public/600276.html research/issuers/600900/qa.json research/issuers/600276/qa.json research/issuers/600900/release-gates.json research/issuers/600276/release-gates.json
          # Source-tied real Chromium QA receipts and carefully selected real
          # 1440/390 figure screenshots for independent editorial review;
          # keep the full 48 figure screenshot matrix in Actions artifacts.
          git add research/issuers/600900/visual-qa/result.json research/issuers/600276/visual-qa/result.json
          git add research/issuers/600900/visual-qa/600900-390-flow.png research/issuers/600900/visual-qa/600900-390-pnl.png research/issuers/600900/visual-qa/600900-1440-flow.png
          git add research/issuers/600276/visual-qa/600276-390-sector.png research/issuers/600276/visual-qa/600276-390-flow.png research/issuers/600276/visual-qa/600276-390-cfo.png research/issuers/600276/visual-qa/600276-1440-sector.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-audited independent utility and pharma research pages"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Keep real 1440/768/390 screenshots and original editable source figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-sector-16-research-figures-original-financial-screenshots
          path: |
            public/600900.html
            public/600276.html
            research/issuers/600900/qa.json
            research/issuers/600276/qa.json
            research/issuers/600900/visual-qa/
            research/issuers/600276/visual-qa/
          retention-days: 30
          if-no-files-found: warn
