name: Build 600206 source-bound editorial candidate (not production promotion)

on:
  push:
    branches:
      - editorial/600206-full-research-rebuild-20261121
    paths:
      - research/issuers/600206/source-ledger.json
      - research/issuers/600206/research-brief.json
      - research/issuers/600206/editorial-self-review.json
      - research/issuers/600206/publication.json
      - research/issuers/600206/editorial-manifest.json
      - research/shared/source_publication.py
      - research/shared/editorial_bridge.py
      - research/shared/editorial_geometry.py
      - research/shared/exhibits.py
      - research/shared/test_product_figure_source_contract.py
      - scripts/qa_offline_candidate.py
      - .github/workflows/build-600206-editorial-candidate.yml

permissions:
  contents: write

jobs:
  rebuild-with-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install source PDF and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.6 playwright==1.65.2
      - name: Verify five falsifiable investment theses, exact-yuan maths and immutable brief SHA
        run: |
          mkdir -p work/600206-visual
          python skills/ashare-financial-storytelling/tools/research_evidence.py --code 600206 --brief research/issuers/600206/research-brief.json --out work/600206-visual/research-evidence.json
          python - <<'PY'
          import json,hashlib,pathlib
          folder=pathlib.Path('research/issuers/600206')
          file=folder/'research-brief.json'
          brief=json.loads(file.read_text())
          story=json.loads((folder/'publication.json').read_text())
          evidence=json.loads(pathlib.Path('work/600206-visual/research-evidence.json').read_text())
          assert story['research_evidence_gate']['brief_sha256']==hashlib.sha256(file.read_bytes()).hexdigest(),'RESEARCH_BRIEF_SHA_STALE'
          assert len(brief['theses'])>=5 and len(evidence['theses'])>=5,'NOT_ENOUGH_INDEPENDENT_THESIS_LINES'
          assert sum(len(t['calculations']) for t in evidence['theses'])>=13,'NOT_ENOUGH_ACCOUNTING_RECONCILIATION_PROOFS'
          assert evidence['professional_causal_inference']=='NOT_CHECKED' and evidence['independent_financial_reviewer']=='NOT_CHECKED'
          assert evidence['status']=='PASS_MACHINE_SOURCE_MATH_AND_STRUCTURAL_EVIDENCE_ONLY'
          print('FIVE_THESIS_EXACT_MONEY_FALSIFIABILITY_GATE_PASS',len(evidence['theses']),flush=True)
          PY
      - name: Compile all finance figures and source-backed research to current exact bytes
        run: |
          python research/shared/source_publication.py research/issuers/600206 public/600206.html --catalog-report
          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('.')
          cat=root/'site/research_catalog.json'
          d=json.loads(cat.read_text())
          issuer=next(r for r in d['issuers'] if r['code']=='600206')
          story=json.loads((root/'research/issuers/600206/publication.json').read_text())
          issuer['figures']=len(story['figures'])
          cat.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          html=(root/'public/600206.html').read_bytes()
          sha=hashlib.sha256(html).hexdigest()
          gate=root/'research/issuers/600206/release-gates.json'
          g=json.loads(gate.read_text())
          g['published_html_sha256']=sha
          g['sankey']={'decision':'USED_CONSERVED','proof':'research/issuers/600206/figure-briefs.json','scope':'互斥地区轴，分组收入及自身成本闭合至集团收入、营业成本与毛利；产品轴不相加'}
          g['gates']['VISUAL_EDITORIAL_SELF']['status']='NOT_CHECKED'
          g['gates']['VISUAL_EDITORIAL_SELF']['proof']=''
          g['gates']['VISUAL_EDITORIAL_SELF']['scope']='候选稿已重建，等待实际桌面/手机整页独立编辑自审；不得沿用四图版 PASS'
          g['gates']['BROWSER_LOCAL']['status']='NOT_CHECKED'
          g['gates']['BROWSER_LOCAL']['proof']=''
          gate.write_text(json.dumps(g,ensure_ascii=False,indent=2)+'\n')
          print('CANDIDATE_CHART_COUNT',len(story['figures']),'HTML_SHA',sha,'EDITORIAL_NOT_CHECKED',flush=True)
          PY
      - name: Reject forged product gross-profit source, geometry, and identity
        run: python -m unittest discover -s research/shared -p 'test_product_figure_source_contract.py' -v
      - name: Independently check all twelve source vectors and actual finance geometry
        run: |
          PYTHONPATH=research/shared python - <<'PY'
          import json,pathlib
          from source_publication import chart
          from source_publication_audit import check_vector_source
          from editorial_geometry import check_editorial_svg
          d=pathlib.Path('research/issuers/600206')
          ledger=json.loads((d/'source-ledger.json').read_text())
          publication=json.loads((d/'publication.json').read_text())
          total=0
          for fig in publication['figures']:
              for mobile in (False,True):
                  rendered=chart(ledger,fig,mobile)
                  result=check_vector_source(rendered,ledger)
                  assert result['original_source_vector_values']=='PASS'
                  if fig['family']!='income':
                      geo=check_editorial_svg(rendered,issuer='600206',pdf_sha256=ledger['source']['original_bytes_sha256'])
                      assert geo['status']=='PASS', (fig['id'],mobile,geo)
                  total+=1
          assert total==24,('UNEXPECTED_FIGURES',total)
          print('ALL_12_FIGURES_24_NATIVE_FINANCIAL_VECTORS_SOURCE_AND_GEOMETRY_PASS',total,flush=True)
          PY
      - name: Install real Chromium WebKit and Chinese fonts
        run: |
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture native 1440/768/390 Chromium and 375 WebKit, verify original amounts
        run: |
          python scripts/qa_offline_candidate.py public/600206.html --engine chromium --out work/600206-visual/chromium
          python scripts/qa_offline_candidate.py public/600206.html --engine webkit --out work/600206-visual/webkit
          cp work/600206-visual/chromium/browser.json research/issuers/600206/visual-qa/result.json
          cp work/600206-visual/chromium/browser.json research/quality/editorial-generalization/600206/catalog-browser.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/issuers/600206/release-gates.json')
          j=json.loads(p.read_text())
          j['gates']['BROWSER_LOCAL']['status']='PASS'
          j['gates']['BROWSER_LOCAL']['proof']='research/issuers/600206/visual-qa/result.json'
          j['gates']['BROWSER_LOCAL']['scope']='候选全文双浏览器、原始元及当前HTML SHA的重新验收；独立编辑自审未完成'
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify real visual receipts against current author self-review without claiming independent human judgment
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('.')
          d=root/'research/issuers/600206'
          review=json.loads((d/'editorial-self-review.json').read_text())
          catalog=json.loads((root/'site/research_catalog.json').read_text())
          issuer=next(x for x in catalog['issuers'] if x['code']=='600206')
          actual=hashlib.sha256((root/'public/600206.html').read_bytes()).hexdigest()
          chrome=json.loads((root/'work/600206-visual/chromium/browser.json').read_text())
          webkit=json.loads((root/'work/600206-visual/webkit/browser.json').read_text())
          assert review['status']=='PASS_EXECUTOR_SELF_REVIEW_ONLY'
          assert actual==review['reviewed_html_sha256']==chrome['sha256']==webkit['sha256'],'EDITORIAL_SELF_REVIEW_ON_WRONG_HTML'
          assert issuer['figures']==review['reviewed_figures']==12
          for receipt,ws in ((chrome,{1440,768,390}),(webkit,{375})):
              assert {v['width'] for v in receipt['viewports']}==ws,'UNVERIFIED_MOBILE_VIEWPORT'
              for view in receipt['viewports']:
                  figures=view['figures']
                  assert len(figures)==12 and sum(f.get('role')=='primary' for f in figures)==1
                  assert not any(f.get('issues') or f.get('overlap') for f in figures)
                  assert sum(len(f.get('values',[])) for f in figures)>=75
          required={'R1','R2','R3','R4','R5','V1','V2','V3','V4','V5','V6'}
          rubric=review['scores']
          assert set(rubric)==required,'MISSING_EDITORIAL_RUBRIC_CATEGORIES'
          scores=[rubric[k]['score'] for k in sorted(required)]
          assert all(type(z) is int and 2<=z<=3 for z in scores) and sum(scores)/len(scores)>=2.5
          assert not review['p0_findings']
          assert review['remaining_unverified'] and review['executor'].find('not independent human reviewer')!=-1
          gates=d/'release-gates.json'
          record=json.loads(gates.read_text())
          record['gates']['VISUAL_EDITORIAL_SELF']={
             'status':'PASS',
             'proof':'research/issuers/600206/editorial-self-review.json',
             'scope':'执行者按实际1440/768/390 Chromium及375 WebKit整页与逐图做11项R/V自评，所有维度>=2、均分>=2.5且无P0；不代表独立人类研究/艺术二审。'
          }
          assert record['gates']['INDEPENDENT_HUMAN_REVIEW']['status']=='NOT_CHECKED'
          assert record['release_class']=='source_limited_preview','MUST_NOT_PROMOTE_UNVERIFIED_SOURCE_LIMITED_REPORT'
          gates.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print('AUTHENTIC_BROWSER_SHA_BOUND_EDITORIAL_SELF_REVIEW_PASS',actual,flush=True)
          PY
          python scripts/check_release_contract.py
      - name: Commit generated candidate and source evidence without promoting publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/600206.html site/research_catalog.json research/issuers/600206/qa.json research/issuers/600206/figure-briefs.json research/issuers/600206/release-gates.json research/issuers/600206/visual-qa/result.json research/quality/editorial-generalization/600206/catalog-browser.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate 600206 twelve-chart research candidate with source and browser evidence"
            git push origin HEAD:editorial/600206-full-research-rebuild-20261121
          else
            echo "SOURCE_AND_BROWSER_EVIDENCE_ALREADY_CURRENT_NO_COMMIT_REQUIRED"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 600206-editorial-rebuild-real-desktop-and-mobile
          path: work/600206-visual/
          retention-days: 14
          if-no-files-found: warn
