name: Source intake - ASR 688220 official 2026H1 original PDF
on:
  push:
    branches: ['work/asrmicro-688220-2026h1']
    paths:
      - 'research/issuers/688220/intake_source.py'
      - '.github/workflows/intake-asrmicro-688220.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-pdf-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup PDF source tools
        run: python -m pip install --disable-pip-version-check -q pymupdf
      - name: Fetch SSE original PDF, check issuer and record SHA, pages, line/column evidence
        run: python research/issuers/688220/intake_source.py
      - name: Commit verifiable source bytes and extracted physical pages to research branch
        run: |
          git config user.name "financials-source-bot"
          git config user.email "financials-source-bot@users.noreply.github.com"
          git add research/issuers/688220/source/ research/issuers/688220/source-manifest.json research/issuers/688220/extracted/ research/issuers/688220/source-blocks/ research/issuers/688220/source-images/
          if ! git diff --cached --quiet; then
            git commit -m "Archive full 688220 original 2026H1 PDF and physical page source evidence"
            git pull --rebase origin work/asrmicro-688220-2026h1
            git push origin HEAD:work/asrmicro-688220-2026h1
          fi
      - name: Preserve source original and page images in GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asrmicro-688220-2026h1-original-source-and-page-audit
          path: |
            research/issuers/688220/source/
            research/issuers/688220/source-manifest.json
            research/issuers/688220/extracted/
            research/issuers/688220/source-blocks/
            research/issuers/688220/source-images/
          retention-days: 30
          if-no-files-found: warn
