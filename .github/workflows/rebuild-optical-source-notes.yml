name: Rebuild audited optical income partitions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-optical-source-notes.yml'
      - 'skills/ashare-financial-storytelling/v7/engine/**'
      - 'skills/ashare-financial-storytelling/v7/examples/**'
      - 'skills/ashare-financial-storytelling/v7/tests/test_reported_revenue_partitions.py'
      - 'public/300394.html'
      - 'public/300502.html'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audited-optical-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Original disclosure partition adversarial tests
        run: |
          python -m unittest discover -s skills/ashare-financial-storytelling/v7/tests -p test_reported_revenue_partitions.py -v
      - name: Generate two original issuer full HTMLs from source ledgers
        shell: bash
        run: |
          mkdir -p optical-rebuilt
          V7=skills/ashare-financial-storytelling/v7
          python "$V7/engine/render_v7.py" --ledger "$V7/engine/sample-ledger.json" --memo "$V7/engine/sample-memo.json" --out optical-rebuilt/300394.html --qa optical-rebuilt/300394-qa.json
          python "$V7/engine/render_v7.py" --ledger "$V7/examples/xinyisheng-2026H1-ledger.json" --memo "$V7/examples/xinyisheng-2026H1-memo.json" --out optical-rebuilt/300502.html --qa optical-rebuilt/300502-qa.json
      - name: Verify full-generated money ribbons contain real source classifications
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib
          root=pathlib.Path('optical-rebuilt')
          for code,needle,pg in [('300394','其他业务（附注）','140'),('300502','其他（业务类型）','104')]:
              p=root/f'{code}.html'
              h=p.read_text()
              assert len(re.findall(r'<figure class="exhibit(?: has-native-finance)?"',h))==(10 if code=='300394' else 11),(code,'source-driven full financial-figure count')
              assert h.count('<figure class="exhibit has-native-finance">')>=(9 if code=='300394' else 10),(code,'original mobile-specific finance drawings absent')
              # v9 hero figure has both native desktop and mobile connected
              # income Sankeys with original exact-yuan source/cost metadata.
              from decimal import Decimal as D
              import xml.etree.ElementTree as ET
              from pathlib import Path
              from importlib.util import spec_from_file_location,module_from_spec
              import sys
              sys.path.insert(0,str(Path('research/shared').resolve()))
              from v7_optical_income_adapter import optical_flow_plan
              ledger_path=(Path('skills/ashare-financial-storytelling/v7/engine/sample-ledger.json')
                  if code=='300394' else Path('skills/ashare-financial-storytelling/v7/examples/xinyisheng-2026H1-ledger.json'))
              plan=optical_flow_plan(json.loads(ledger_path.read_text()))
              total=plan.check()
              count=len(plan.sources)
              assert h.count('data-design-system="FINANCIALS_UNIFIED_STORY_V1"')==2,(code,'TWO_NATIVE_UNIFIED_FIGURES_REQUIRED')
              assert h.count('data-node-id="revenue-total"')==2,(code,'SINGLE_SHARED_TOTAL_PER_FIGURE_REQUIRED')
              assert h.count('data-stage="source-to-revenue"')==2*count,(code,'ALL_EXCLUSIVE_SOURCES_MUST_CONNECT')
              assert h.count('data-stage="revenue-to-outcome"')==4*count,(code,'OWN_PRODUCT_GP_AND_COST_MUST_CONNECT')
              assert h.count(f'data-revenue-yuan="{total}"')==2,(code,'EXACT_SOURCE_REVENUE_NOT_IN_BOTH_FIGURES')
              assert 'viewBox="0 0 1100' in h and 'viewBox="0 0 330' in h,(code,'DESKTOP_MOBILE_NOT_INDEPENDENT')
              assert '未列示差额（计算）' not in h,(code,'fake balancing node still present')
              assert needle in h,(code,'source category absent')
              assert 'p.'+pg in h,(code,'source physical page absent')
              assert 'data-ribbon-yuan=' in h,(code,'not an original-yuan proportional money flow')
              assert 'UNVERIFIED_REVENUE_PARTITION' not in h
              print('SOURCE_CLASSIFICATION_HTML_PASS',code,len(h),hashlib.sha256(h.encode()).hexdigest(),flush=True)
          PY
      - name: Hard gate exact published byte identity (canonical and historic stable URL)
        shell: bash
        run: |
          cmp optical-rebuilt/300394.html public/300394.html
          cmp optical-rebuilt/300394.html public/300394/2026-H1/index.html
          cmp optical-rebuilt/300502.html public/300502.html
          cmp optical-rebuilt/300502.html public/300502/2026-H1/index.html
          python -m unittest discover -s skills/ashare-financial-storytelling/v7/tests -p test_xinyisheng_case.py -v
          echo 'OPTICAL_PUBLISHED_SOURCE_IDENTITY_PASS'
      - name: Archive newly generated sources for release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-optical-source-partitions-300394-300502
          path: optical-rebuilt/
          retention-days: 30
