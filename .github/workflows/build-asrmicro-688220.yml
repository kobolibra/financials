name: Build and audit ASR 688220 source-limited standalone research
on:
  push:
    branches: ['work/asrmicro-688220-2026h1', 'work/688220-source-cells-verified-nine-figures', 'work/688220-zero-width-sankey-desktop-qa', 'quality/688220-shared-full-pnl-native-profit-20261108', main]
    paths:
      - 'research/issuers/688220/**'
      - '!research/issuers/688220/visual-qa/**'
      - '!research/issuers/688220/visual-qa-native/**'
      - '!research/issuers/688220/live-visual-qa/**'
      - '!research/issuers/688220/qa.json'
      - '!research/issuers/688220/release-gates.json'
      - 'research/shared/signed_statement_waterfall.py'
      - '.github/workflows/build-asrmicro-688220.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-accounting-and-offline-article:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Source ledger accounting + adversarial invariants
        run: |
          python -m pip install --disable-pip-version-check -q pymupdf
          python research/issuers/688220/verify_pages.py
          python research/shared/test_conserved_flow.py
          python research/issuers/688220/test_accounting.py
          python -m unittest discover -s research/issuers/688220 -p 'test_shared_pnl.py' -v
          python -O -m unittest discover -s research/issuers/688220 -p 'test_shared_pnl.py' -v
          python research/issuers/688220/publish.py --out public/688220.html --qa research/issuers/688220/qa.json
          test -s public/688220.html
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('research/issuers/688220')
          briefs=json.loads((root/'figure-briefs.json').read_text())
          qa=json.loads((root/'qa.json').read_text())
          x=Path('public/688220.html').read_text()
          required=[q['id'] for q in briefs['figure_briefs']]
          assert len(required)==len(set(required)) and len(required)>=1, 'all figures must have source-led author briefs'
          assert x.count('class="figure"')==len(required), 'published figures must match research-approved briefs'
          assert qa['figures_required']==len(required), 'published QA must match figure briefs'
          assert qa['checks']['FULL_PNL_GROSS_TO_OPERATING_SIGNED']=='PASS'
          assert qa['checks']['SANKEY_EACH_SOURCE_COST_GP_NONNEGATIVE']=='PASS'
          assert 'FINANCIALS IN VISUALS' in x
          assert '<script src=' not in x
          assert '"rev":"chip_rev"' in x or '"rev": "chip_rev"' in x
          assert 'NOT_CHECKED' in Path('research/issuers/688220/qa.json').read_text(), 'Do not certify external reviewer'
          print('SOURCE_LED_RESEARCH_RENDER_PASS',len(x))
          PY
      - name: Install Chromium, Playwright and real Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-list :lang=zh family | grep -qi 'Noto'
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Local 1440, 768, 390 fully rendered browser QA, source tables and SVG downloads
        run: |
          python research/issuers/688220/qa_browser.py --html public/688220.html --out research/issuers/688220/visual-qa-native
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          repo=Path('.')
          report=repo/'public/688220.html'
          root=repo/'research/issuers/688220'
          record=json.loads((root/'visual-qa-native/result.json').read_text(encoding='utf8'))
          release=root/'release-gates.json'
          meta=json.loads(release.read_text(encoding='utf8'))
          sha=hashlib.sha256(report.read_bytes()).hexdigest()
          assert record['html_sha256']==sha
          assert meta['gates']['INDEPENDENT_HUMAN_REVIEW']['status']=='NOT_CHECKED'
          assert meta['gates']['OFFICIAL_PDF_BYTE_EQUIVALENCE']['status']=='NOT_CHECKED'
          assert meta['gates']['REPORTED_NOTE_TIES']['status']=='FAIL'
          assert meta['release_class']=='source_limited_preview'
          assert {z['width'] for z in record['actual_3_viewport_checks']}=={390,768,1440}
          for pic in ('flow_390.png','flow_1440.png','pnl_390.png','cfo_390.png'):
              content=(root/'visual-qa-native'/pic).read_bytes()
              assert hashlib.sha256(content).hexdigest()==record['real_CJK_screenshot_sha_bytes'][pic]['sha256']
          actual_live=meta['published_html_sha256']
          candidate=meta.get('unmerged_candidate')
          if sha==actual_live:
              # Source-identical rebuilt main is already deployed. Keep actual
              # live evidence immutable, not an invented UNMERGED candidate.
              assert candidate is None,'STALE_CANDIDATE_ON_ALREADY_DEPLOYED_BYTES'
              assert meta['live_release_fingerprint']==sha
              assert meta['gates']['CLOUDFLARE_LIVE']['status']=='PASS'
              proof=json.loads((root/'live-release-receipt.json').read_text(encoding='utf8'))
              assert proof['status']=='PASS' and proof['public_html_sha256']==sha
              assert proof['verified_git_commit']==meta['actual_main_release_commit']
              assert proof['actual_publication_action']==meta['gates']['CLOUDFLARE_LIVE']['proof']
              assert proof['source_pdf_sha256']==meta['source_pdf']['sha256']
              assert {q['width'] for q in proof['real_chromium_viewports']}=={390,768,1440}
              assert proof['SSE_original_bytes_equivalence']=='NOT_CHECKED'
              print('ASR_REBUILT_CURRENT_LIVE_IDENTICAL_SOURCE_NO_GHOST_CANDIDATE',sha)
          else:
              # New source bytes must remain separate pending release evidence.
              assert isinstance(candidate,dict),'NEW_CANDIDATE_MISSING_SEPARATE_RELEASE_STATE'
              assert candidate['base_deployed_html_sha256']==actual_live
              assert candidate['independent_finance_and_art_review']=='NOT_CHECKED'
              assert candidate['promotion_status']=='UNMERGED_NOT_DEPLOYED'
              if os.environ.get('GITHUB_REF_NAME')=='main':
                  assert candidate['candidate_full_html_sha256']==sha
                  print('ASR_MAIN_NEW_HTML_LIVE_NOT_YET_CERTIFIED',sha)
              else:
                  candidate['candidate_full_html_sha256']=sha
                  candidate['current_sha_browser_proof']='LOCAL_ONLY'
                  candidate['note']='Original full-source P&L is a local candidate. Current live SHA and independent human approval require separate proof.'
                  release.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
                  print('ASR_NEW_SOURCE_CANDIDATE_NOT_DEPLOYED',sha)
          PY
      - name: Clean independent rebuild of exactly the published article
        run: |
          sha256sum public/688220.html
          cp public/688220.html /tmp/asr-688220-generated.html
          python research/issuers/688220/publish.py --out /tmp/asr-second-generation.html --qa /tmp/asr-second-generation-qa.json
          cmp /tmp/asr-688220-generated.html /tmp/asr-second-generation.html
      - name: Verify published main HTML, QA and source provenance regenerate bit-for-bit
        if: github.ref_name == 'main'
        run: |
          git diff --exit-code -- public/688220.html research/issuers/688220/qa.json research/issuers/688220/source-verification.json
      - name: Commit standalone article and technical QA (not homepage promotion)
        if: github.ref_name != 'main'
        run: |
          git config user.name "financials-research-bot"
          git config user.email "financials-research-bot@users.noreply.github.com"
          git add public/688220.html research/issuers/688220/qa.json research/issuers/688220/source-verification.json research/issuers/688220/source-images/p135.png research/issuers/688220/source-images/p146.png
          git add research/issuers/688220/release-gates.json research/issuers/688220/visual-qa-native/result.json
          git add research/issuers/688220/visual-qa-native/flow_390.png research/issuers/688220/visual-qa-native/flow_1440.png research/issuers/688220/visual-qa-native/pnl_390.png research/issuers/688220/visual-qa-native/cfo_390.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate ASR 688220 independent source-limited research HTML and ledger QA"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Archive readable actual 1440/768/390 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asrmicro-688220-2026h1-offline-original-visual-qa
          path: |
            public/688220.html
            research/issuers/688220/qa.json
            research/issuers/688220/visual-qa-native/
          if-no-files-found: warn
          retention-days: 30
